    <script>
        // EN/ES switch: CSS shows the blocks marked data-lang; this sets the language, remembers it and swaps aria-labels.
        (function () {
            var root = document.documentElement;
            var current = root.getAttribute('data-ui') === 'es' ? 'es' : 'en';
            window.qwindLang = function () { return current; };

            function swapLabels(lang) {
                document.querySelectorAll('[data-es-label]').forEach(function (el) {
                    if (el.__enLabel === undefined) el.__enLabel = el.getAttribute('aria-label') || '';
                    el.setAttribute('aria-label', lang === 'es' ? el.getAttribute('data-es-label') : el.__enLabel);
                });
            }

            function apply(lang, save) {
                current = lang;
                root.setAttribute('data-ui', lang);
                if (document.getElementById('demoToggle')) root.lang = lang;
                document.querySelectorAll('[data-set-lang]').forEach(function (b) {
                    b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === lang));
                });
                swapLabels(lang);
                if (save) { try { localStorage.setItem('qwind-lang', lang); } catch (e) {} }
                document.dispatchEvent(new CustomEvent('qwind:lang', { detail: lang }));
            }

            document.querySelectorAll('[data-set-lang]').forEach(function (b) {
                b.addEventListener('click', function () { apply(b.getAttribute('data-set-lang'), true); });
            });
            apply(current, false);
        })();

        // Dark / light button: dark is the default; the choice is remembered in the browser.
        (function () {
            var root = document.documentElement;
            var button = document.getElementById('themeToggle');
            if (!button) return;
            var labels = {
                en: { dark: 'Switch to light mode', light: 'Switch to dark mode' },
                es: { dark: 'Cambiar a modo claro', light: 'Cambiar a modo oscuro' }
            };
            function theme() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
            function refresh() {
                var lang = window.qwindLang ? window.qwindLang() : 'en';
                var t = theme();
                button.setAttribute('aria-label', labels[lang][t]);
                button.setAttribute('title', labels[lang][t]);
                button.setAttribute('aria-pressed', String(t === 'light'));
            }
            button.addEventListener('click', function () {
                var next = theme() === 'light' ? 'dark' : 'light';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('qwind-theme', next); } catch (e) {}
                refresh();
            });
            document.addEventListener('qwind:lang', refresh);
            refresh();
        })();
    </script>
