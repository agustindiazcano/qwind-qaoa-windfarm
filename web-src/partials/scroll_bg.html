    <canvas id="wind-bg" aria-hidden="true"></canvas>
    <script>
        // Background colour drifts softly while scrolling: --p goes from 0 (top) to 1 (bottom of the page).
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var root = document.documentElement, ticking = false;
            function update() {
                var max = root.scrollHeight - window.innerHeight;
                var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
                root.style.setProperty('--p', p.toFixed(3));
                ticking = false;
            }
            window.addEventListener('scroll', function () {
                if (!ticking) { ticking = true; requestAnimationFrame(update); }
            }, { passive: true });
            window.addEventListener('resize', update);
            update();
        })();

        // Subtle wind streamlines drifting across the background canvas.
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var canvas = document.getElementById('wind-bg');
            if (!canvas || !canvas.getContext) return;
            var ctx = canvas.getContext('2d');
            var w = 0, h = 0, dpr = 1, raf = null, last = 0;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            var streams = [];
            var COUNT = 28;
            function makeStream(randomX) {
                var len = 160 + Math.random() * 260;
                return {
                    x: randomX ? Math.random() * (w + len * 2) - len : -len - Math.random() * 100,
                    y: Math.random() * (h || 800),
                    len: len,
                    speed: 35 + Math.random() * 45,
                    amp: 7 + Math.random() * 15,
                    freq: 0.008 + Math.random() * 0.01,
                    phase: Math.random() * Math.PI * 2,
                    width: 1.2 + Math.random() * 1.4,
                    alpha: 0.09 + Math.random() * 0.12,
                    alt: Math.random() > 0.5
                };
            }

            resize();
            for (var i = 0; i < COUNT; i++) streams.push(makeStream(true));

            function palette() {
                var light = document.documentElement.getAttribute('data-theme') === 'light';
                return light
                    ? ['14, 116, 144', '29, 78, 216']
                    : ['6, 182, 212', '56, 189, 248'];
            }

            function frame(ts) {
                if (document.hidden) { raf = null; return; }
                var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
                last = ts;
                ctx.clearRect(0, 0, w, h);

                var cols = palette();
                var t = ts * 0.001;
                for (var i = 0; i < streams.length; i++) {
                    var s = streams[i];
                    s.x += s.speed * dt;
                    if (s.x - s.len > w + 60) {
                        streams[i] = makeStream(false);
                        continue;
                    }

                    var rgb = cols[s.alt ? 1 : 0];
                    var grad = ctx.createLinearGradient(s.x - s.len, s.y, s.x, s.y);
                    grad.addColorStop(0, 'rgba(' + rgb + ', 0)');
                    grad.addColorStop(0.5, 'rgba(' + rgb + ', ' + s.alpha + ')');
                    grad.addColorStop(1, 'rgba(' + rgb + ', 0)');

                    ctx.beginPath();
                    var steps = 12;
                    for (var j = 0; j <= steps; j++) {
                        var px = (s.x - s.len) + (s.len * j) / steps;
                        var py = s.y + Math.sin(px * s.freq + s.phase + t * 0.6) * s.amp;
                        if (j === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = s.width;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                raf = requestAnimationFrame(frame);
            }

            window.addEventListener('resize', resize);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden && !raf) { last = 0; raf = requestAnimationFrame(frame); }
            });
            raf = requestAnimationFrame(frame);
        })();
    </script>
