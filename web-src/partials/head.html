<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <script>
        // Keep the page invisible until the web fonts are ready, so text does not jump when they swap in.
        (function () {
            var root = document.documentElement;
            root.classList.add('fonts-loading');
            function done() { root.classList.remove('fonts-loading'); }
            var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            var loaded = new Promise(function (r) { window.addEventListener('load', r); });
            Promise.all([fonts, loaded]).then(done);
            setTimeout(done, 1000);
        })();
    </script>
    <script>
        // Language (EN/ES): chosen with the switch in the navbar, remembered in the browser. English by default.
        (function () {
            var lang = 'en';
            try { var saved = localStorage.getItem('qwind-lang'); if (saved === 'es' || saved === 'en') lang = saved; } catch (e) {}
            document.documentElement.setAttribute('data-ui', lang);
            // Theme: dark by default (whatever the OS prefers); light only if the visitor chose it with the button.
            var theme = 'dark';
            try { if (localStorage.getItem('qwind-theme') === 'light') theme = 'light'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main"><span lang="en" data-lang="en">Skip to content</span><span lang="es" data-lang="es">Saltar al contenido</span></a>
